<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Header -->
    <header class="header">
      My Dashboard
    </header>
    
    <!-- Sidebar / Menu -->
    <aside class="sidebar">
      <h2>Menu</h2>
      <ul>
        <li>Home</li>
        <li>Reports</li>
        <li>Settings</li>
      </ul>
    </aside>

    <!-- Main Content Area with Cards -->
    <main class="main-content">
      
      <div class="card">
        <div class="card-icon blue-user">👤</div>
        <div class="card-text">
          <div class="card-value">120</div>
          <div class="card-label">Users</div>
        </div>
      </div>

      <div class="card">
        <div class="card-icon money-bag">💰</div>
        <div class="card-text">
          <div class="card-value">Rs 45k</div>
          <div class="card-label">Sales</div>
        </div>
      </div>

      <div class="card">
        <div class="card-icon box-icon">📦</div>
        <div class="card-text">
          <div class="card-value">36</div>
          <div class="card-label">Orders</div>
        </div>
      </div>

      <div class="card">
        <div class="card-icon star-icon">⭐</div>
        <div class="card-text">
          <div class="card-value">4.8</div>
          <div class="card-label">Rating</div>
        </div>
      </div>

      <div class="card">
        <div class="card-icon msg-icon">💬</div>
        <div class="card-text">
          <div class="card-value">18</div>
          <div class="card-label">Messages</div>
        </div>
      </div>

      <div class="card">
        <div class="card-icon tick-icon">✅</div>
        <div class="card-text">
          <div class="card-value">92%</div>
          <div class="card-label">Done</div>
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
      Made with CSS Grid
    </footer>

  </div>

</body>
</html>
