<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderGo - Plan Your Trip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- नेविगेशन बार (Navbar) -->
    <nav class="navbar">
        <div class="logo">WanderGo</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Trips</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- हीरो सेक्शन (Hero Section) -->
    <header class="hero-section">
        <h1>Plan your next trip in minutes</h1>
        <p>Simple, cheap and fun travel plans.</p>
        
        <!-- इमेज प्लेसहोल्डर बॉक्स -->
        <div class="hero-image-box">
            <span>img/hero.jpg</span>
        </div>
    </header>

    <!-- फीचर्स ग्रिड (Features Section) -->
    <section class="features-container">
        <div class="feature-card">Easy Booking</div>
        <div class="feature-card">Best Prices</div>
        <div class="feature-card">24x7 Help</div>
    </section>

</html>
